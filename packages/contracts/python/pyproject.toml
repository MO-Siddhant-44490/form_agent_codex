[project]
name = "form-contracts"
version = "0.1.0"
description = "Shared typed contracts for the form-filling agent (source of truth)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["form_contracts"]
