<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form Agent</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e5e7eb; --brand:#2b6cb0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; margin: 0; padding: 0; font-size: 14px; color: var(--fg); background: var(--bg); }
  header { padding: .7rem 1rem; border-bottom: 1px solid var(--line); }
  header h2 { margin: 0; font-size: 1.05rem; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: .15rem; }
  details { border-bottom: 1px solid var(--line); }
  summary { padding: .55rem 1rem; cursor: pointer; font-weight: 600; font-size: 12px; color: var(--muted); }
  .profile-body { padding: 0 1rem .6rem; }
  textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 12px; padding: .5rem; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: .5rem .9rem; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
  button.primary { background: var(--brand); color: #fff; width: 100%; margin-top: .5rem; }
  button.primary:disabled { background: #9db8d2; cursor: default; }
  #status { padding: .5rem 1rem; font-size: 12px; background: #f3f4f6; border-bottom: 1px solid var(--line); }
  #status.ok { background: #e6f4ea; } #status.warn { background: #fef3c7; } #status.err { background: #fde2e1; }
  #chat { flex: 1; overflow-y: auto; padding: .75rem 1rem; display: flex; flex-direction: column; gap: .5rem; }
  .msg { max-width: 88%; padding: .45rem .6rem; border-radius: 10px; font-size: 13px; line-height: 1.35; white-space: pre-wrap; word-wrap: break-word; }
  .msg.agent { align-self: flex-start; background: #f1f5f9; border: 1px solid var(--line); }
  .msg.user { align-self: flex-end; background: var(--brand); color: #fff; }
  .msg.sys { align-self: center; color: var(--muted); font-size: 12px; background: transparent; }
  .q { align-self: flex-start; max-width: 88%; background: #fff8e1; border: 1px solid #f0d98a; border-radius: 10px; padding: .5rem .6rem; font-size: 13px; }
  .q.err { background: #fde2e1; border-color: #f0a8a4; }
  .q b { display: block; margin-bottom: .3rem; }
  .q .row { display: flex; gap: .4rem; margin-top: .35rem; }
  .q input { flex: 1; padding: .35rem .45rem; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .q .chip { background: #fff; border: 1px solid #ccc; padding: .25rem .5rem; border-radius: 999px; font-size: 12px; }
  form#composer { display: flex; gap: .4rem; padding: .6rem 1rem; border-top: 1px solid var(--line); }
  #chatinput { flex: 1; padding: .5rem .6rem; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; }
  #send { background: var(--brand); color: #fff; }
</style>
</head>
<body>
<header>
  <h2>Form Agent</h2>
  <div class="sub">Fills the form in <b>this tab</b>. Never submits — you review first.</div>
</header>

<details id="profile">
  <summary>Your profile (key: value per line)</summary>
  <div class="profile-body">
    <textarea id="facts" rows="8"></textarea>
    <button id="fill" class="primary">Fill this form</button>
  </div>
</details>

<div id="status">Ready. Open a form in this tab, then click Fill.</div>

<div id="chat"></div>

<form id="composer" autocomplete="off">
  <input id="chatinput" type="text" placeholder="Answer, or e.g. “set state to Karnataka”, “refill”…" />
  <button id="send" type="submit">Send</button>
</form>

<script src="sidepanel.js"></script>
</body>
</html>
