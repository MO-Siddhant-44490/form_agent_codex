<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Inner form</title>
<style>label{display:block;margin-top:1rem;font-weight:600}input{display:block;padding:.4rem;width:320px}</style></head>
<body>
<form id="application-form">
  <label for="name">Full name</label>
  <input id="name" name="full_name" type="text" required>
  <label for="email">Email address</label>
  <input id="email" name="email" type="email" required>
</form>
</body></html>
