<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shadow DOM Form — Fixture</title></head>
<body>
<h1>Application (web components)</h1>
<!-- A custom element holding the form inside an OPEN shadow root. The agent
     must perceive and fill fields across the shadow boundary. -->
<fa-form-card></fa-form-card>
<div id="result"></div>
<script>
class FaFormCard extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: "open" });
    root.innerHTML = `
      <style>label{display:block;margin-top:1rem;font-weight:600}input{display:block;padding:.4rem;width:320px}</style>
      <form id="application-form">
        <label for="name">Full name</label>
        <input id="name" name="full_name" type="text" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required>
      </form>`;
  }
}
customElements.define("fa-form-card", FaFormCard);
window.__fixture = { id: "shadow-form", submissions: [] };
</script>
</body></html>
