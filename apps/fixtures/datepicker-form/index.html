<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Date Picker Form — Fixture</title>
<style>body{font-family:system-ui;max-width:560px;margin:2rem auto;padding:0 1rem}
label{display:block;margin-top:1rem;font-weight:600}input{padding:.4rem;width:260px}
.cal-header{display:flex;justify-content:space-between;align-items:center;width:260px}
[role=grid]{border:1px solid #ccc;padding:.5rem;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;width:260px}
.datepicker[data-open=false] [role=grid], .datepicker[data-open=false] .cal-header{display:none}
[role=gridcell]{padding:.3rem;cursor:pointer;border:1px solid #eee}</style>
</head>
<body>
<h1>Application</h1>
<form id="application-form">
  <label for="name">Full name</label>
  <input id="name" name="full_name" type="text" required style="display:block;margin-top:.25rem">

  <label for="dob">Date of birth</label>
  <div class="datepicker" data-datepicker data-open="false">
    <input id="dob" role="combobox" aria-haspopup="grid" aria-controls="cal"
           aria-expanded="false" data-value-input="date_of_birth" readonly placeholder="Pick a date">
    <input type="hidden" name="date_of_birth" value="">
    <div class="cal-header">
      <button type="button" id="prev-month" aria-label="Previous month">‹</button>
      <span id="month-label"></span>
      <button type="button" id="next-month" aria-label="Next month">›</button>
    </div>
    <div id="cal" role="grid"></div>
  </div>
</form>
<script>
  const dp = document.querySelector(".datepicker");
  const input = document.getElementById("dob");
  const cal = document.getElementById("cal");
  const label = document.getElementById("month-label");
  const hidden = document.querySelector('input[name="date_of_birth"]');
  // Calendar starts on January 1998 — the target (April 17) is 3 months away,
  // forcing month navigation.
  let shownYear = 1998, shownMonth = 1;
  const MONTHS = ["","January","February","March","April","May","June","July","August","September","October","November","December"];
  function render() {
    label.textContent = `${MONTHS[shownMonth]} ${shownYear}`;
    cal.innerHTML = "";
    const days = new Date(shownYear, shownMonth, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const iso = `${shownYear}-${String(shownMonth).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const cell = document.createElement("button");
      cell.type = "button"; cell.setAttribute("role","gridcell");
      cell.dataset.date = iso; cell.setAttribute("aria-label", `${MONTHS[shownMonth]} ${d}, ${shownYear}`);
      cell.textContent = String(d);
      cal.appendChild(cell);
    }
  }
  function open(){ dp.dataset.open="true"; input.setAttribute("aria-expanded","true"); render(); }
  function close(){ dp.dataset.open="false"; input.setAttribute("aria-expanded","false"); }
  input.addEventListener("focus", open); input.addEventListener("click", open);
  document.getElementById("prev-month").addEventListener("click", () => {
    shownMonth--; if(shownMonth<1){shownMonth=12;shownYear--;} render(); });
  document.getElementById("next-month").addEventListener("click", () => {
    shownMonth++; if(shownMonth>12){shownMonth=1;shownYear++;} render(); });
  cal.addEventListener("click", (e) => {
    const cell = e.target.closest("[role=gridcell]"); if(!cell) return;
    hidden.value = cell.dataset.date; input.value = cell.dataset.date;
    input.dispatchEvent(new Event("change",{bubbles:true})); close();
  });
  window.__fixture = { id:"datepicker-form", submissions:[] };
</script>
</body></html>
