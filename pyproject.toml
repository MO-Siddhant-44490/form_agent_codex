[project]
name = "form-agent-workspace"
version = "0.1.0"
description = "Workspace root for the agentic form-filling system (see plan.md)"
requires-python = ">=3.12"
dependencies = ["form-contracts", "agent-backend"]

[tool.uv.workspace]
members = ["packages/contracts/python", "services/agent_backend"]

[tool.uv.sources]
form-contracts = { workspace = true }
agent-backend = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["packages/contracts/python/tests", "services/agent_backend/tests"]
filterwarnings = [
  # PyMuPDF's SWIG bindings on Python 3.12; harmless and not ours to fix.
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
