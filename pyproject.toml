[project]
name = "form-agent-workspace"
version = "0.1.0"
description = "Workspace root for the agentic form-filling system (see plan.md)"
requires-python = ">=3.12"
dependencies = ["form-contracts"]

[tool.uv.workspace]
members = ["packages/contracts/python"]

[tool.uv.sources]
form-contracts = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["packages/contracts/python/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
