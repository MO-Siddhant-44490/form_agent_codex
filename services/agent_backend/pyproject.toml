[project]
name = "agent-backend"
version = "0.1.0"
description = "Orchestration driver for the form-filling agent (Slice 1: plain loop, no LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "form-contracts",
    "pydantic>=2.7",
    "playwright>=1.40",
    "pymupdf>=1.28.2",
]

[project.optional-dependencies]
docling = [
    "docling>=2.0",
]
bedrock = [
    "boto3>=1.43.87",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_backend"]
