[project]
name = "agent-backend"
version = "0.1.0"
description = "Orchestration driver for the form-filling agent (Slice 1: plain loop, no LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "form-contracts",
    "pydantic>=2.7",
    "playwright>=1.40",
    "pymupdf>=1.28.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "cryptography==43.0.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
docling = [
    "docling>=2.0",
]
bedrock = [
    "boto3>=1.43.87",
]
server = [
    "boto3>=1.34",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_backend"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]
